<!-- Tell Someone Well Being Incident Report Lwc -->
<template>
    <div class="slds-is-relative">
        <template lwc:if={showSpinner}>
            <lightning-spinner alternative-text="Submitting" size="medium" variant="brand" class="slds-is-fixed"></lightning-spinner>
        </template>
        <template lwc:if={showFormAll}>
            <div class="slds-m-bottom_xx-small">
                <h2>Behavior or Well Being Report</h2>
            </div>
            <template lwc:if={isNotAnonymous}>
                <fieldset class={reporterElementsCss}>
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12 slds-m-bottom_medium">
                        <label class="slds-form-element__label selection-labels form-required-label" for="well-being-reporter-name-id">
                            Your Name:</label>
                        <p class="textarea-sublabel">First and last name.</p>
                        <div class="slds-form-element__control">
                            <lightning-input id="well-being-reporter-name-id"
                                             type="text"
                                             label=""
                                             value={wellBeingIncidentFormValues.reporterName}
                                             data-inputtype="name"
                                             variant="label-hidden"
                                             required="true"
                                             onchange={inputValueHandler}>
                            </lightning-input>
                        </div>
                    </div>
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12 slds-m-bottom_medium">
                        <label class="slds-form-element__label selection-labels form-required-label" for="well-being-reporter-email-id">
                            Your Email Address:</label>
                        <p class="textarea-sublabel">St. Thomas email address.</p>
                        <div class="slds-form-element__control">
                            <lightning-input id="well-being-reporter-email-id"
                                             type="text"
                                             label=""
                                             value={wellBeingIncidentFormValues.reporterEmail}
                                             data-inputtype="email"
                                             variant="label-hidden"
                                             required="true"
                                             onchange={inputValueHandler}
                                             onblur={emailValidationBlur}>
                            </lightning-input>
                            <div lwc:if={validEmailWarning} class="validation-text">Invalid email address format</div>
                        </div>
                    </div>
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12 slds-m-bottom_medium">
                        <label class="slds-form-element__label selection-labels form-required-label" for="well-being-reporter-phone-id">
                            Your Phone Number:</label>
                        <div class="slds-form-element__control">
                            <lightning-input id="well-being-reporter-phone-id"
                                             type="text"
                                             label=""
                                             value={wellBeingIncidentFormValues.reporterPhone}
                                             data-inputtype="phone"
                                             variant="label-hidden"
                                             required="true"
                                             onchange={inputValueHandler}>
                            </lightning-input>
                        </div>
                    </div>
                </fieldset>
            </template>
            <fieldset class="slds-grid slds-grid_vertical">
                <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12 slds-m-bottom_medium">
                    <label class="slds-form-element__label selection-labels form-required-label" for="well-being-individual-name-id">
                        Individual of Concern:</label>
                    <p class="textarea-sublabel">First and last name of the individual you are concerned about.</p>
                    <div class="slds-form-element__control">
                        <lightning-input id="well-being-individual-name-id"
                                         type="text"
                                         label=""
                                         value={wellBeingIncidentFormValues.students_first_name}
                                         data-inputtype="involvedname"
                                         variant="label-hidden"
                                         required="true"
                                         onchange={inputValueHandler}>
                        </lightning-input>
                    </div>
                </div>
                <div class={indidvidualConcernElementsCss}>
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12 slds-m-bottom_medium">
                        <label class="slds-form-element__label selection-labels" for="well-being-individual-email-id">
                            Individual's Email Address:</label>
                        <p class="textarea-sublabel">St. Thomas email address of the individual you are concerned about.</p>
                        <div class="slds-form-element__control">
                            <lightning-input id="well-being-individual-email-id"
                                             type="text"
                                             label=""
                                             value={wellBeingIncidentFormValues.students_email_address}
                                             data-inputtype="involvedemail"
                                             variant="label-hidden"
                                             onchange={inputValueHandler}
                                             onblur={emailValidationBlur}>
                            </lightning-input>
                            <div lwc:if={validEmailWarningIndividual} class="validation-text">Invalid email address format</div>
                        </div>
                    </div>
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12 slds-m-bottom_medium">
                        <label class="slds-form-element__label selection-labels" for="well-being-individual-phone-id">
                            Individual's Phone Number:</label>
                        <p class="textarea-sublabel">Phone number of the individual you are concerned about.</p>
                        <div class="slds-form-element__control">
                            <lightning-input id="well-being-individual-phone-id"
                                             type="text"
                                             label=""
                                             value={wellBeingIncidentFormValues.students_phone_number}
                                             data-inputtype="involvedphone"
                                             variant="label-hidden"
                                             onchange={inputValueHandler}>
                            </lightning-input>
                        </div>
                    </div>
                </div>
            </fieldset>
            <div class="slds-form-element slds-grid slds-grid_vertical slds-m-bottom_medium">
                <label class="slds-form-element__label slds-col slds-size_1-of-1 selection-labels form-required-label" for="well-being-incident-date-id">
                    Date of Concerning Incident:</label>
                <div class="slds-form-element__control slds-col slds-size_1-of-1 slds-large-size_7-of-12">
                    <lightning-input id="well-being-incident-date-id"
                                     type="date"
                                     label=""
                                     value={_incidentDate}
                                     data-inputtype="date"
                                     variant="label-hidden"
                                     required="true"
                                     onchange={inputValueHandler}
                                     onblur={dateValidationBlur}>>
                    </lightning-input>
                    <div lwc:if={validDateWarning} class="validation-text">{dateWarningText}</div>
                </div>
            </div>
            <div class="slds-grid slds-m-bottom_large">
                <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_11-of-12">
                    <label class="slds-form-element__label selection-labels form-required-label" for="well-being-incident-description-id">
                        Concern Description:</label>
                    <p class="textarea-sublabel">Provide a detailed description of your concern for the individual indicated above.</p>
                    <div class="slds-form-element__control">
                        <lightning-textarea class="custom-textarea-tall"
                                            id="well-being-incident-description-id"
                                            label=""
                                            value={wellBeingIncidentFormValues.description}
                                            data-inputtype="description"
                                            variant="label-hidden"
                                            required="true"
                                            onchange={inputValueHandler}>
                        </lightning-textarea>
                    </div>
                </div>
            </div>
            <div class="slds-m-top_medium">
                <div class="slds-form-element">
                    <label class="slds-form-element__label selection-labels" for="bias-report-attach-documents-id">
                        Attach Documents/Upload</label>
                    <p class="textarea-sublabel">Upload any supporting documentation that you have for this incident.<br>
                        A total of {maxFileCount} files at a maximum of {maxFileSize}MB per file can be uploaded.<br>
                        Supported documents types: .csv, .doc, .docx, .jpg, .jpeg, .pdf, .png, .txt, .xls, .xlsx.</p>
                    <div class="slds-form-element__control">
                        <lightning-input
                                id="bias-report-attach-documents-id"
                                type="file"
                                label=""
                                accept={acceptedExtensionTypes}
                                multiple="true"
                                onchange={attachDocumentsHandler}>
                        </lightning-input>
                    </div>
                </div>
                <div lwc:if={showAttachDocumentName} class="slds-m-top_small attached-file-list">
                    <p>Attached Documents:</p>
                    <template for:each={attachDocuments} for:item="file">
                        <div key={file.fileId} class="slds-p-left_xx-small">
                            {file.fileName}
                            <lightning-button-icon class="slds-m-left_x-small"
                                                   icon-name="utility:clear"
                                                   variant="bare"
                                                   alternative-text="Delete File"
                                                   title="Delete File"
                                                   data-fileid={file.fileId}
                                                   onclick={attachDocumentsDelete}>
                            </lightning-button-icon>
                        </div>
                    </template>
                </div>
                <div lwc:if={showAttachDocumentExcludeName} class="slds-m-top_xx-small excluded-file-list">
                    <p>Excluded Documents:</p>
                    <template for:each={attachDocumentsExclude} for:item="file">
                        <p key={file.fileId} class="slds-p-left_xx-small">{file.fileName} {file.fileSize}MB - {file.fileWarning}</p>
                    </template>
                </div>
            </div>
            <div class={submitSectionElementCss}>
                <div class="slds-m-top_x-large slds-m-bottom_medium">
                    <div class="slds-m-bottom_xxx-small" lwc:if={submitDisable}>
                        <p class="submit-warning">
                            <abbr class="slds-required" title="Required">*</abbr> Required fields not completed.
                        </p>
                    </div>
                    <lightning-button class="submit_button"
                                      title="Please enter all required fields."
                                      type="button"
                                      label="SUBMIT"
                                      variant="brand"
                                      disabled={submitDisable}
                                      onclick={submitFormHandler}
                                      disable-animation>
                    </lightning-button>
                </div>
<!--                <template lwc:if={saveDocumentsFail}>-->
<!--                    <div class="slds-media slds-media_center slds-scoped-notification slds-m-bottom_medium submit-error-message" role="status">-->
<!--                        <div class="slds-media__figure">-->
<!--                            <lightning-icon icon-name="utility:warning"-->
<!--                                            alternative-text="save documents error"-->
<!--                                            title="save documents error"-->
<!--                                            size="small">-->
<!--                            </lightning-icon>-->
<!--                        </div>-->
<!--                        <div class="slds-media__body">-->
<!--                            <p>There was a problem saving your documents. Please contact salesforce@stthomas.edu to report this error.</p>-->
<!--                        </div>-->
<!--                    </div>-->
<!--                </template>-->
                <template lwc:if={submitWellBeingFormFail}>
                    <div class="slds-media slds-media_center slds-scoped-notification slds-m-bottom_medium submit-error-message" role="status">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:warning"
                                            alternative-text="submit well-being form error"
                                            title="submit well-being form error"
                                            size="small">
                            </lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p>There was a problem submitting your form. Try submitting your form again. If the problem continues, please contact <a href="mailto:salesforce@stthomas.edu">salesforce@stthomas.edu</a>.</p>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
