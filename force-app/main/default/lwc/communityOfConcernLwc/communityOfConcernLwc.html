<!-- Community Of Concern Lwc -->
<template>
    <div lwc:if={caseSubmittedCheck} class="regular_body_text">
        <p class="slds-m-bottom_small">Thank you for your submission</p>
    </div>
    <form lwc:else id="communityofconcernform" data-form="communityofconcernform">
        <p class="slds-m-bottom_medium heading-text">Tell Someone</p>
        <div class="regular_body_text">
            <p class="slds-m-bottom_small">4 <b>Tell Someone</b> is a St. Thomas tool that
                allows you to report concerns about an undergraduate or graduate student or employee who may be
                struggling with issues related to health, well-being, or threats of harm, or who may be navigating a
                situation where they suspect discrimination, bias, or harassment are present.
                The goal of <b>Tell Someone</b> is to help students and employees who may need
                support and to enhance the well-being of our University community.</p>
            <p class="slds-m-bottom_small"><b><i>Online reports are reviewed during regular business hours. If
                you believe someone is at risk of immediate harm, call 911 or the Public Safety emergency line at 651-962-5555.</i></b></p>
            <p class="slds-m-bottom_small">The University of St. Thomas is committed to a culture of care and respect
                for one another. Because speaking up, advocating, and supporting others are foundational values at St. Thomas, we
                encourage you to <b>Tell Someone</b> when you witness concerning behavior.
                Each report is individually reviewed by designated staff and a team works to connect people of concern
                to campus partners who can provide mental health support, basic needs, and a multitude of other resources.
                <b>Tell Someone</b> also triages and refers any threats of violence to the appropriate campus authority.</p>
            <p class="slds-m-bottom_small"><b>Tell Someone</b> is coordinated by the Dean of
                Students Office. However, if the <b>Tell Someone</b> Report involves faculty or staff and no
                students are involved, the report is automatically sent to Human Resources. Staff who receive reports are trained to identify concerns,
                strategize pathways to resolution, and offer connection to university resources.</p>
            <p class="slds-m-bottom_small"><b>Information on reporting party:</b></p>
            <p class="slds-m-bottom_small">Student records, including incident reports, are protected by FERPA
                (Family Educational Rights and Privacy Act), therefore any information regarding the outcome of this
                report will not be shared with you without the direct written consent of the student(s) involved.</p>
            <p class="slds-m-bottom_small">Reports about faculty/staff are private [add language on confidentiality and privacy].</p>
            <p class="slds-m-top_large slds-m-bottom_medium"><b>Tell Us About Your Concerns</b></p>
            <div class="slds-form-element slds-m-vertical_medium">
                <label class="slds-form-element__label selection-labels" for="i-am-selection-id">
                    I am a:<abbr class="slds-required" title="Required">*</abbr></label>
                <div class="slds-form-element__control">
                    <lightning-combobox class="selection-width"
                                        id="i-am-selection-id"
                                        label=""
                                        value={communityOfConcernCase.IAmValue}
                                        placeholder="Choose an item"
                                        options={iAmOptions}
                                        data-selecttype="iamselect"
                                        variant="label-hidden"
                                        onchange={singleSelectHandler}>
                    </lightning-combobox>
                </div>
            </div>
            <p lwc:if={iAmAnonymousCheck} class="slds-m-bottom_small"><i>Reports can be made anonymously
                via this form. If you choose to submit this form anonymously, please understand our ability to take action may be limited,
                as we may need additional information and will not have a way to ask follow-up questions</i>
            </p>
            <template lwc:if={showConcernedWhoSelect}>
                <!--                <p class="heading-text slds-m-vertical_medium">Tell Us Who You're Concerned About</p>-->
                <div class="slds-form-element slds-m-vertical_medium">
                    <label class="slds-form-element__label selection-labels" for="concerned-who_select-id">
                        Who are you concerned about?<abbr class="slds-required" title="Required">*</abbr></label>
                    <div class="slds-form-element__control">
                        <lightning-combobox class="selection-width"
                                            id="concerned-who_select-id"
                                            label=""
                                            value={communityOfConcernCase.ConcernedWhoValue}
                                            placeholder="Choose an item"
                                            options={concernedWhoOptions}
                                            data-selecttype="concernedwhoselect"
                                            variant="label-hidden"
                                            onchange={singleSelectHandler}>
                        </lightning-combobox>
                    </div>
                </div>
            </template>
            <template lwc:if={showConcernedWhatSelect}>
                <div class="slds-form-element slds-m-vertical_medium">
                    <label class="slds-form-element__label selection-labels" for="concerned-what-selection-id">
                        What are you concerned about?<abbr class="slds-required" title="Required">*</abbr></label>
                    <div class="slds-form-element__control">
                        <lightning-combobox class="selection-width-wider"
                                            id="concerned-what-selection-id"
                                            label=""
                                            value={communityOfConcernCase.ConcernedWhatValue}
                                            placeholder="Choose an item"
                                            options={concernedWhatOptions}
                                            data-selecttype="concernedwhatselect"
                                            variant="label-hidden"
                                            onchange={singleSelectHandler}>
                        </lightning-combobox>
                    </div>
                </div>
            </template>

            <div lwc:if={showWhatTommieAlerts} class="slds-m-top_large">
                <c-tommie-cares-lwc param-url={paramUrl} community-of-concern-lwc="advisor_info_hide"></c-tommie-cares-lwc>
            </div>

            <div lwc:if={showWhatDiscrimination} class="slds-m-top_large">
                <c-advocate-bias-incident-report-lwc param-url={paramUrl} community-of-concern-report-type={communityOfConcernReportType} lwc:spread={childProps}></c-advocate-bias-incident-report-lwc>
            </div>

            <div lwc:if={showWhatMisconduct} class="slds-m-top_large">
                <c-advocate-title-ix-incident-report-lwc param-url={paramUrl} community-of-concern-report-type={communityOfConcernReportType} lwc:spread={childProps}></c-advocate-title-ix-incident-report-lwc>
            </div>

            <template lwc:if={showWhatOther.show}>
                <div lwc:if={showWhatOther.text} class="slds-m-bottom_small">
                    <p><i>If you have updates to provide on a concern regarding a faculty or staff, please contact Human Resources at askhr@stthomas.edu</i></p>
                </div>

                <!--            <template lwc:if={showIAmInfo}>-->
                <div class="slds-m-vertical_medium">
                    <p class="slds-m-top_large slds-m-bottom_medium"><b>Your Information</b></p>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-form-element slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-right_medium slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="i-am-first-name-id">
                                Your First Name:<abbr class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-input id="i-am-first-name-id"
                                                 type="text"
                                                 label=""
                                                 value={communityOfConcernCase.IAmFirstName}
                                                 data-inputgroup="iaminfo"
                                                 data-inputtype="firstname"
                                                 placeholder="First Name"
                                                 variant="label-hidden"
                                                 disabled={iAmInfoInputDisabled}
                                                 onchange={inputTextHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-right_medium slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="i-am-last-name-id">
                                Your Last Name:<abbr class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-input id="i-am-last-name-id"
                                                 type="text"
                                                 label="Last Name:"
                                                 value={communityOfConcernCase.IAmLastName}
                                                 data-inputgroup="iaminfo"
                                                 data-inputtype="lastname"
                                                 placeholder="Last Name"
                                                 variant="label-hidden"
                                                 disabled={iAmInfoInputDisabled}
                                                 onchange={inputTextHandler}>
                                </lightning-input>
                            </div>
                        </div>
                    </div>

                    <div class="slds-grid slds-wrap">
                        <div class="slds-form-element slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-right_medium slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="i-am-email-id">
                                Your Email:<abbr class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-input id="i-am-email-id"
                                                 type="email"
                                                 label="Email:"
                                                 value={communityOfConcernCase.IAmEmail}
                                                 data-inputgroup="iaminfo"
                                                 data-inputtype="email"
                                                 placeholder="Email"
                                                 variant="label-hidden"
                                                 disabled={iAmInfoInputDisabled}
                                                 onchange={inputTextHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-right_medium slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="i-am-phone-id">Your Phone#:</label>
                            <div class="slds-form-element__control">
                                <lightning-input id="i-am-phone-id"
                                                 type="text"
                                                 label="Phone:"
                                                 value={communityOfConcernCase.IAmPhone}
                                                 data-inputgroup="iaminfo"
                                                 data-inputtype="phone"
                                                 placeholder="Phone"
                                                 variant="label-hidden"
                                                 onchange={inputTextHandler}>
                                </lightning-input>
                            </div>
                        </div>
                    </div>
                </div>
                <!--            </template>-->

                <!--            <template lwc:if={showConcernedWhoInfo}>-->
                <div class="slds-m-vertical_medium">
                    <p class="slds-m-top_large slds-m-bottom_medium"><b>Who You Are Concerned About Information</b></p>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-form-element slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-right_medium slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="concerned-who-first-name-id">
                                {communityOfConcernCase.ConcernedWhoValue} First Name:<abbr class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-input id="concerned-who-first-name-id"
                                                 type="text"
                                                 label=""
                                                 value={communityOfConcernCase.ConcernedWhoFirstName}
                                                 data-inputgroup="concernedwhoinfo"
                                                 data-inputtype="firstname"
                                                 placeholder="First Name"
                                                 variant="label-hidden"
                                                 onchange={inputTextHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-right_medium slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="concerned-who-last-name-id">
                                {communityOfConcernCase.ConcernedWhoValue} Last Name <abbr class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-input id="concerned-who-last-name-id"
                                                 type="text"
                                                 label="Last Name:"
                                                 value={communityOfConcernCase.ConcernedWhoLastName}
                                                 data-inputgroup="concernedwhoinfo"
                                                 data-inputtype="lastname"
                                                 placeholder="Last Name"
                                                 variant="label-hidden"
                                                 onchange={inputTextHandler}>
                                </lightning-input>
                            </div>
                        </div>
                    </div>
                    <div class="slds-grid slds-wrap">
                        <div class="slds-form-element slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-right_medium slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="concerned-who-email-id">{communityOfConcernCase.ConcernedWhoValue} Email:</label>
                            <div class="slds-form-element__control">
                                <lightning-input id="concerned-who-email-id"
                                                 type="email"
                                                 label="Email:"
                                                 value={communityOfConcernCase.ConcernedWhoEmail}
                                                 data-inputgroup="concernedwhoinfo"
                                                 data-inputtype="email"
                                                 placeholder="Email"
                                                 variant="label-hidden"
                                                 onchange={inputTextHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-right_medium slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="concerned-who-phone-id">{communityOfConcernCase.ConcernedWhoValue} Phone:</label>
                            <div class="slds-form-element__control">
                                <lightning-input id="concerned-who-phone-id"
                                                 type="text"
                                                 label="Phone:"
                                                 value={communityOfConcernCase.ConcernedWhoPhone}
                                                 data-inputgroup="concernedwhoinfo"
                                                 data-inputtype="phone"
                                                 placeholder="Phone"
                                                 variant="label-hidden"
                                                 onchange={inputTextHandler}>
                                </lightning-input>
                            </div>
                        </div>
                    </div>
                </div>
                <!--            </template>-->

                <div class="slds-m-vertical_small">
                    <div class="slds-form-element slds-m-bottom_x-small">
                        <label class="slds-form-element__label selection-labels" for="concerned-what-additional-info-id">
                            <abbr class="slds-required" title="Required">*</abbr>Please provide additional information about your concern:</label>
                        <div class="slds-form-element__control">
                            <lightning-textarea class="custom-textarea selection-width-wider"
                                                id="concerned-what-additional-info-id"
                                                label=""
                                                value={communityOfConcernCase.ConcernedWhatAdditionalInfo}
                                                data-inputgroup="concernedwhatadditionalinfo"
                                                placeholder="Additional information"
                                                variant="label-hidden"
                                                onchange={inputTextHandler}>
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
                <div class="slds-m-vertical_x-large">
                    <lightning-button class="submit_button"
                                      type="button"
                                      label="SUBMIT"
                                      variant="success"
                                      disabled={submitDisable}
                                      onclick={submitCase}
                                      disable-animation>
                    </lightning-button>
                </div>
            </template>
        </div>

        <div class="regular_body_text">
            <template lwc:if={showWhatWellBeing.student}>
                <p class="slds-m-bottom_small"><i>Concerns for students may include mental health, self-harm, substance
                    misuse, food insecurity, financial hardship, threatening behaviors, and much more. Reports are reviewed by
                    the Dean of Students in consultation with the Title IX Coordinator, Counseling and Psychological Services,
                    Residence Life, and other relevant campus partners.</i>
                </p>
                <p>
                    Who "Student" display this form: [need link to form]
                </p>
            </template>
            <template lwc:if={showWhatWellBeing.nonStudent}>
                <p class="slds-m-bottom_small"><i>Concerns for staff or faculty may include mental health, substance
                    misuse, concerning workplace behaviors, and more. Reports are reviewed by Human Resources in consultation
                    with Title IX and/or other campus partners when appropriate.</i>
                </p>
                <p>
                    Who "Non Student" display this form: [need link to form]
                </p>
            </template>
        </div>
    </form>
    <template lwc:if={submitCaseSpinner}>
        <lightning-spinner alternative-text="Submitting" size="medium" variant="brand"></lightning-spinner>
    </template>
</template>
