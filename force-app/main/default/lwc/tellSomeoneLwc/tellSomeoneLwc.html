                    <div class="slds-grid">

                            <label class="slds-form-element__label selection-labels form-required-label" for="i-am-selection-id">

                            <div class="slds-form-element__control">

                    <template lwc:if={showConcernedWhoSelect}>
                        <div class="slds-grid slds-m-top_medium">
                            <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12">

                                                        variant="label-hidden"
                                                        required="true"
                                                        onchange={selectValueHandler}>
                                    </lightning-combobox>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template lwc:if={showConcernedWhatSelect}>

                    </div>
                    <template lwc:if={showWhatWellBeing.show}>
                        <div class="slds-m-top_medium">
                            <p class="slds-m-bottom_small" lwc:if={showWhatWellBeing.student}>Concerns for students may include mental health,
                                self-harm, substance misuse, food insecurity, financial hardship, threatening behaviors,
                                and more. Reports are reviewed by the Dean of Students in consultation with relevant
                                campus partners on a need-to-know basis.</p>
                            <p class="slds-m-bottom_small" lwc:if={showWhatWellBeing.nonStudent}>Concerns for staff or

                                more. Reports are reviewed by Human Resources in consultation with Title IX and/or other
                                campus partners when appropriate.</p>
                        </div>

                                                             data-inputtype="firstname"
                                                             placeholder="First Name"
                                                             variant="label-hidden"

                                    Please provide additional information about your concern:</label>
                                <div class="slds-form-element__control">
                                    <lightning-textarea class="custom-textarea-tall"

                                                        variant="label-hidden"
                                                        required="true"
                                                        onchange={inputValueHandler}>
                                    </lightning-textarea>
                                </div>

                            <lightning-button class="submit_button"
                                              type="button"
                                              label="SUBMIT"
                                              variant="brand"
                                              disabled={submitDisable}
                                              onclick={submitCase}
                                              disable-animation>
                            </lightning-button>
                            <template lwc:if={showSpinner}>
                                <lightning-spinner alternative-text="Submitting" size="medium" variant="brand"></lightning-spinner>
                            </template>
                        </div>

                            </div>
                            <div class="slds-media__body">
