<!-- Advocate Bias Incident Report Lwc -->
<template>
    <div class="regular-body-text">
        <div class="slds-grid">
            <p class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">This form should be used by anyone
                who believes they have witnessed or been the target of an incident of discrimination, bias, or
                harassment based on a protected class (sex, race, color, religion, national origin, ancestry,
                disability, age, sexual orientation, marital status, military status, gender
                expression/identity, genetic information, pregnancy or any other protected classes). These
                reports are reviewed by the Dean of Students, Title IX Coordinator, and Human Resources,
                dependent on the status of the individual who caused harm.</p>
        </div>
        <p class="slds-m-vertical_x-small textarea-sublabel-2"><abbr class="slds-required" title="Required"><b>*</b></abbr> indicates a required field</p>

        <template lwc:if={showFormAll}>
            <template lwc:if={isNotAnonymous}>
                <p><b>Reporter Information</b></p>
                <div class="slds-grid">
                    <p class="slds-col slds-size_1-of-1 textarea-sublabel-2">You may leave information about yourself, or you may remain anonymous. If
                        you do not provide your name and contact information, the university’s ability to respond may be
                        limited.</p>
                </div>
                <div class="slds-grid slds-m-top_x-small slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1 slds-small-size_8-of-12 slds-medium-size_6-of-12 slds-large-size_5-of-12">
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="bias-reporter-name-id">Your
                                Name:<abbr class="slds-required" title="Required">*</abbr></label>
                            <p class="textarea-sublabel-1">Please provide your full name.</p>
                            <div class="slds-form-element__control">
                                <lightning-input id="bias-reporter-name-id"
                                                 type="text"
                                                 label=""
                                                 value={biasIncidentFormValues.reporterName}
                                                 data-inputtype="name"
                                                 variant="label-hidden"
                                                 onchange={inputValueHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="bias-reporter-phone-id">Your Phone Number:</label>
                            <div class="slds-form-element__control">
                                <lightning-input id="bias-reporter-phone-id"
                                                 type="text"
                                                 label=""
                                                 value={biasIncidentFormValues.reporterPhone}
                                                 data-inputtype="phone"
                                                 variant="label-hidden"
                                                 onchange={inputValueHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="bias-reporter-email-id">Your
                                Email Address:<abbr class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-input id="bias-reporter-email-id"
                                                 type="text"
                                                 label=""
                                                 value={biasIncidentFormValues.reporterEmail}
                                                 data-inputtype="email"
                                                 variant="label-hidden"
                                                 onchange={inputValueHandler}
                                                 onblur={emailValidationBlur}>
                                </lightning-input>
                                <div lwc:if={validEmailWarning} class="validation-text">Invalid email address format</div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            <p><b>Time and Location</b></p>
            <div class="slds-grid">
                <p class="slds-col slds-size_1-of-1 textarea-sublabel-2">Please provide the approximate date, time and location that this incident occurred.</p>
            </div>
            <div class="slds-m-top_xx-small slds-m-bottom_medium">
                <div class="slds-grid slds-wrap slds-m-bottom_medium">
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-small-size_6-of-12 slds-medium-size_4-of-12 slds-large-size_3-of-12 slds-m-right_medium">
                        <label class="slds-form-element__label selection-labels" for="bias-report-date-id">Date<abbr class="slds-required" title="Required">*</abbr></label>
                        <div class="slds-form-element__control">
                            <lightning-input id="bias-report-date-id"
                                    type="date"
                                    label=""
                                    value={_incidentDate}
                                    data-inputtype="date"
                                    variant="label-hidden"
                                    onchange={inputValueHandler}
                                    onblur={dateValidationBlur}>
                            </lightning-input>
                            <div lwc:if={validDateWarning} class="validation-text">{dateWarningText}</div>
                        </div>
                    </div>
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-small-size_6-of-12 slds-medium-size_4-of-12 slds-large-size_3-of-12">
                        <label class="slds-form-element__label selection-labels" for="bias-report-time-id">Time</label>
                        <div class="slds-form-element__control">
                            <lightning-input
                                    id="bias-report-time-id"
                                    type="time"
                                    label=""
                                    value={_incidentTime}
                                    data-inputtype="time"
                                    variant="label-hidden"
                                    onchange={inputValueHandler}
                                    onblur={dateValidationBlur}>
                            </lightning-input>
                            <div lwc:if={validTimeWarning} class="validation-text">{timeWarningText}</div>
                        </div>
                    </div>
                </div>
                <div class="slds-grid slds-m-bottom_small">
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-medium-size_11-of-12 slds-large-size_9-of-12">
                        <label class="slds-form-element__label selection-labels" for="bias-report-location-id">Location
                            of Incident<abbr class="slds-required" title="Required">*</abbr></label>
                        <p class="textarea-sublabel-1">Please provide as much detail about the location of this incident as possible.</p>
                        <div class="slds-form-element__control">
                            <lightning-textarea class="custom-textarea"
                                                id="bias-report-location-id"
                                                label=""
                                                value={biasIncidentFormValues.additionalInformation}
                                                data-inputtype="location"
                                                variant="label-hidden"
                                                onchange={inputValueHandler}>
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
            </div>
            <p class="slds-m-top_x-large"><b>Parties Involved</b></p>
            <div class="slds-m-top_x-small slds-m-bottom_medium">
                <div class="slds-grid slds-m-bottom_small">
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-medium-size_11-of-12 slds-large-size_9-of-12">
                        <label class="slds-form-element__label selection-labels" for="bias-report-students-involved-id">Individuals
                            Involved<abbr class="slds-required" title="Required">*</abbr></label>
                        <p class="textarea-sublabel-1">Please list the names of all the individuals involved in this incident.</p>
                        <div class="slds-form-element__control">
                            <lightning-textarea class="custom-textarea"
                                                id="bias-report-students-involved-id"
                                                label=""
                                                value={biasIncidentFormValues.otherStudent}
                                                data-inputtype="studentsinvolved"
                                                variant="label-hidden"
                                                onchange={inputValueHandler}>
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
                <div class="slds-grid">
                    <div class="slds-col slds-size_1-of-1 slds-small-size_8-of-12 slds-medium-size_6-of-12 slds-large-size_5-of-12">
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="bias-report-who-harmed-id">Who was harmed?
                                <abbr class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-input id="bias-report-who-harmed-id"
                                                 type="text"
                                                 label=""
                                                 value={biasIncidentFormValues.who_was_the_target_of_the_behavior}
                                                 data-inputtype="whoharmed"
                                                 variant="label-hidden"
                                                 onchange={inputValueHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels"
                                   for="bias-report-affiliation-harmed-id">Affiliation of Harmed Party<abbr
                                    class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-combobox id="bias-report-affiliation-harmed-id"
                                                    label=""
                                                    options={affiliationOfTargetOptions}
                                                    value={biasIncidentFormValues.affiliation_of_target}
                                                    data-selecttype="affiliationharmed"
                                                    variant="label-hidden"
                                                    onchange={selectValueHandler}>
                                </lightning-combobox>
                            </div>
                        </div>
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels"
                                   for="bias-report-who-caused-harm-id">Who
                                caused the harm?<abbr class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-input id="bias-report-who-caused-harm-id"
                                                 type="text"
                                                 label=""
                                                 value={biasIncidentFormValues.who_engaged_in_the_behavior}
                                                 data-inputtype="whocausedharm"
                                                 variant="label-hidden"
                                                 onchange={inputValueHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels"
                                   for="bias-report-affiliation-person-caused-harm-id">Affiliation of Person Who
                                Caused Harm<abbr class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-combobox id="bias-report-affiliation-person-caused-harm-id"
                                                    label=""
                                                    options={affiliationOfPersonEngagedInHarmOptions}
                                                    value={biasIncidentFormValues.affiliation_of_person_engaged_in_harm}
                                                    data-selecttype="affiliationcausedharm"
                                                    variant="label-hidden"
                                                    onchange={selectValueHandler}>
                                </lightning-combobox>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <p class="slds-m-top_large"><b>Descriptive Information</b></p>
            <div class="slds-m-top_x-small slds-m-bottom_x-large">
                <div class="slds-grid slds-m-bottom_medium">
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-medium-size_11-of-12 slds-large-size_9-of-12">
                        <label class="slds-form-element__label selection-labels" for="bias-report-incident-description-id">Incident
                            Description<abbr class="slds-required" title="Required">*</abbr></label>
                        <p class="textarea-sublabel-1">Please describe and be as specific about the incident with as much
                            factual details as possible.<br>Include information about the nature of the incident
                            (e.g., physical assault, verbal assault, threats, written slurs, threatening communications, etc.).</p>
                        <div class="slds-form-element__control">
                            <lightning-textarea class="custom-textarea-tall"
                                                id="bias-report-incident-description-id"
                                                label=""
                                                value={biasIncidentFormValues.description}
                                                data-inputtype="description"
                                                variant="label-hidden"
                                                onchange={inputValueHandler}>
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
                <div class="slds-form-element slds-m-bottom_small">
                    <label class="slds-form-element__label selection-labels" for="bias-report-attach-documents-id">Attach documents/Upload</label>
                    <p class="slds-m-bottom_xx-small textarea-sublabel-1">Please upload any supporting documentation that you have for this incident. Max 3MB/file.<br>
                    Supported documents types: .csv, .doc, .docx, .jpg, .jpeg, .pdf, .png, .txt, .xls, .xlsx.</p>
                    <div class="slds-form-element__control">
                        <lightning-input
                                id="bias-report-attach-documents-id"
                                type="file"
                                label=""
                                accept={acceptedExtensionTypes}
                                multiple="true"
                                onchange={attachDocumentsHandler}>
                        </lightning-input>
                    </div>
                </div>
                <div lwc:if={showAttachDocumentName} class="slds-m-bottom_xx-small attached-file-list">
                    <p>Attaching Documents:</p>
                    <template for:each={attachDocuments} for:item="file">
                        <div key={file.fileId} class="slds-p-left_xx-small">
                            {file.fileName}
                            <lightning-button-icon class="slds-m-left_x-small"
                                                   icon-name="utility:clear"
                                                   variant="bare"
                                                   alternative-text="Delete File"
                                                   title="Delete File"
                                                   data-fileid={file.fileId}
                                                   onclick={attachDocumentsDelete}>
                            </lightning-button-icon>
                        </div>
                    </template>
                </div>
                <div lwc:if={showAttachDocumentExcludeName} class="excluded-file-list">
                    <p>Excluded Documents:</p>
                    <template for:each={attachDocumentsExclude} for:item="file">
                        <p key={file.fileId} class="slds-p-left_xx-small">{file.fileName} {file.fileSize}MB - {file.fileWarning}</p>
                    </template>
                </div>
            </div>
            <div class="slds-m-top_x-large slds-m-bottom_medium">
                <lightning-button class="submit_button"
                                  title="Please enter all required fields."
                                  type="button"
                                  label="SUBMIT"
                                  variant="success"
                                  disabled={submitDisable}
                                  onclick={submitFormHandler}
                                  disable-animation>
                </lightning-button>
            </div>
            <template lwc:if={saveDocumentsFail}>
                <div class="slds-media slds-media_center slds-scoped-notification slds-m-bottom_medium submit-error-message" role="status">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="utility:warning"
                                        alternative-text="save documents error"
                                        title="save documents error"
                                        size="small">
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p>There was a problem saving your documents. Please contact salesforce@stthomas.edu to report this error.</p>
                    </div>
                </div>
            </template>
            <template lwc:if={submitBiasIncidentFormFail}>
                <div class="slds-media slds-media_center slds-scoped-notification slds-m-bottom_medium submit-error-message" role="status">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="utility:warning"
                                        alternative-text="submit bias incident form error"
                                        title="submit bias incident form error"
                                        size="small">
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p>There was a problem submitting your form. Please contact salesforce@stthomas.edu to report this error.</p>
                    </div>
                </div>
            </template>
        </template>
    </div>
</template>
