        <template lwc:if={showFormAll}>
            <template lwc:if={isNotAnonymous}>
                <div class="slds-grid">
                    <div class="slds-col slds-size_1-of-1 slds-small-size_7-of-12 slds-medium-size_5-of-12 slds-large-size_4-of-12">
                        <div class="slds-form-element slds-m-bottom_medium">
                            <label class="slds-form-element__label selection-labels" for="well-being-reporter-name-id">Your Name:
                                <abbr class="slds-required" title="Required">*</abbr></label>
                            <p class="textarea-sublabel-1">First and last name.</p>
                            <div class="slds-form-element__control">
                                <lightning-input id="well-being-reporter-name-id"
                                                 type="text"
                                                 label=""
                                                 value={wellBeingIncidentFormValues.reporterName}
                                                 data-inputtype="name"
                                                 variant="label-hidden"
                                                 onchange={inputValueHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element slds-m-bottom_medium">
                            <label class="slds-form-element__label selection-labels" for="well-being-reporter-email-id">Your Email Address:
                                <abbr class="slds-required" title="Required">*</abbr></label>
                            <p class="textarea-sublabel-1">St. Thomas email address.</p>
                            <div class="slds-form-element__control">
                                <lightning-input id="well-being-reporter-email-id"
                                                 type="text"
                                                 label=""
                                                 value={wellBeingIncidentFormValues.reporterEmail}
                                                 data-inputtype="email"
                                                 variant="label-hidden"
                                                 onchange={inputValueHandler}
                                                 onblur={emailValidationBlur}>
                                </lightning-input>
                                <div lwc:if={validEmailWarning} class="validation-text">Invalid email address format</div>
                            </div>
                        </div>
                        <div class="slds-form-element slds-m-bottom_medium">
                            <label class="slds-form-element__label selection-labels" for="well-being-reporter-phone-id">Your Phone Number:
                                <abbr class="slds-required" title="Required">*</abbr></label>
                            <div class="slds-form-element__control">
                                <lightning-input id="well-being-reporter-phone-id"
                                                 type="text"
                                                 label=""
                                                 value={wellBeingIncidentFormValues.reporterPhone}
                                                 data-inputtype="phone"
                                                 variant="label-hidden"
                                                 onchange={inputValueHandler}>
                                </lightning-input>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            <div class="slds-form-element slds-grid slds-grid_vertical slds-m-bottom_medium">
                <label class="slds-form-element__label slds-col slds-size_1-of-1 slds-small-size_6-of-12 slds-medium-size_5-of-12 selection-labels" for="well-being-individual-name-id">Individual of Concern
                    <abbr class="slds-required" title="Required">*</abbr></label>
                <p class="textarea-sublabel-1">First and last name of the individual you are concerned about.</p>
                <div class="slds-form-element__control slds-col slds-size_1-of-1 slds-small-size_7-of-12 slds-medium-size_5-of-12 slds-large-size_4-of-12">
                    <lightning-input id="well-being-individual-name-id"
                                     type="text"
                                     label=""
                                     value={wellBeingIncidentFormValues.otherStudent}
                                     data-inputtype="involvedname"
                                     variant="label-hidden"
                                     onchange={inputValueHandler}>
                    </lightning-input>
                </div>
            </div>
            <div class="slds-form-element slds-grid slds-grid_vertical slds-m-bottom_medium">
                <label class="slds-form-element__label slds-col slds-size_1-of-1 slds-small-size_6-of-12 slds-medium-size_5-of-12 selection-labels" for="well-being-individual-email-id">Individual's Email Address</label>
                <p class="textarea-sublabel-1">St. Thomas email address of the individual you are concerned about.</p>
                <div class="slds-form-element__control slds-col slds-size_1-of-1 slds-small-size_7-of-12 slds-medium-size_5-of-12 slds-large-size_4-of-12">
                    <lightning-input id="well-being-individual-email-id"
                                     type="text"
                                     label=""
                                     value={wellBeingIncidentFormValues.individuals_email_address}
                                     data-inputtype="involvedemail"
                                     variant="label-hidden"
                                     onchange={inputValueHandler}
                                     onblur={emailValidationBlur}>
                    </lightning-input>
                    <div lwc:if={validEmailWarningIndividual} class="validation-text">Invalid email address format</div>
                </div>
            </div>
            <div class="slds-form-element slds-grid slds-grid_vertical slds-m-bottom_medium">
                <label class="slds-form-element__label slds-col slds-size_1-of-1 slds-small-size_6-of-12 slds-medium-size_5-of-12 selection-labels" for="well-being-individual-phone-id">Individual's Phone Number</label>
                <p class="textarea-sublabel-1">Phone number of the individual you are concerned about.</p>
                <div class="slds-form-element__control slds-col slds-size_1-of-1 slds-small-size_7-of-12 slds-medium-size_5-of-12 slds-large-size_4-of-12">
                    <lightning-input id="well-being-individual-phone-id"
                                     type="text"
                                     label=""
                                     value={wellBeingIncidentFormValues.individuals_phone_number}
                                     data-inputtype="involvedphone"
                                     variant="label-hidden"
                                     onchange={inputValueHandler}>
                    </lightning-input>
                </div>
            </div>
            <div class="slds-grid slds-m-bottom_medium">
                <div class="slds-form-element slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-large-size_2-of-12">
                    <label class="slds-form-element__label selection-labels" for="well-being-incident-date-id">Concerned Date<abbr class="slds-required" title="Required">*</abbr></label>
                    <div class="slds-form-element__control">
                        <lightning-input id="well-being-incident-date-id"
                                         type="date"
                                         label=""
                                         value={_incidentDate}
                                         data-inputtype="date"
                                         variant="label-hidden"
                                         onchange={inputValueHandler}
                                         onblur={dateValidationBlur}>>
                        </lightning-input>
                        <div lwc:if={validDateWarning} class="validation-text">{dateWarningText}</div>
                    </div>
                </div>
            </div>
            <div class="slds-grid">
                <div class="slds-form-element slds-col slds-size_1-of-1 slds-medium-size_10-of-12 slds-large-size_8-of-12">
                    <label class="slds-form-element__label selection-labels" for="well-being-incident-description-id">Concern Description
                        <abbr class="slds-required" title="Required">*</abbr></label>
                    <p class="textarea-sublabel-1">Provide a detailed description of your concern for the individual indicated above.</p>
                    <div class="slds-form-element__control">
                        <lightning-textarea class="custom-textarea-tall"
                                            id="well-being-incident-description-id"
                                            label=""
                                            value={wellBeingIncidentFormValues.description}
                                            data-inputtype="description"
                                            variant="label-hidden"
                                            onchange={inputValueHandler}>
                        </lightning-textarea>
                    </div>
                </div>
            </div>
            <div class="slds-m-top_large slds-m-bottom_x-large">
                <div class="slds-form-element slds-m-top_x-small slds-m-bottom_small">
                    <label class="slds-form-element__label selection-labels" for="bias-report-attach-documents-id">Attach documents/Upload</label>
                    <p class="textarea-sublabel-1">Please upload any supporting documentation that you have for this incident. Max 3MB/file.<br>
                        Supported documents types: .csv, .doc, .docx, .jpg, .jpeg, .pdf, .png, .txt, .xls, .xlsx.</p>
                    <div class="slds-form-element__control">
                        <lightning-input
                                id="bias-report-attach-documents-id"
                                type="file"
                                label=""
                                accept={acceptedExtensionTypes}
                                multiple="true"
                                onchange={attachDocumentsHandler}>
                        </lightning-input>
                    </div>
                </div>
                <div lwc:if={showAttachDocumentName} class="slds-m-bottom_xx-small attached-file-list">
                    <p>Attached Files:</p>
                    <template for:each={attachDocuments} for:item="file">
                        <div key={file.fileId} class="slds-p-left_xx-small">
                            {file.fileName}
                            <lightning-button-icon class="slds-m-left_x-small"
                                                   icon-name="utility:clear"
                                                   variant="bare"
                                                   alternative-text="Delete File"
                                                   title="Delete File"
                                                   data-fileid={file.fileId}
                                                   onclick={attachDocumentsDelete}>
                            </lightning-button-icon>
                        </div>
                    </template>
                </div>
                <div lwc:if={showAttachDocumentExcludeName} class="excluded-file-list">
                    <p>Excluded Files:</p>
                    <template for:each={attachDocumentsExclude} for:item="file">
                        <p key={file.fileId} class="slds-p-left_xx-small">{file.fileName} {file.fileSize}MB - {file.fileWarning}</p>
                    </template>
                </div>
<!--                <div lwc:if={showUrl} class="slds-m-vertical_small">-->
<!--                    Salesforce Supporting Document: <lightning-formatted-url value={returnUrl} tooltip="" target="_blank"></lightning-formatted-url>-->
<!--                </div>-->
            </div>
            <div class="slds-m-top_x-large slds-m-bottom_medium">
                <lightning-button class="submit_button"
                                  title="Please enter all required fields."
                                  type="button"
                                  label="SUBMIT"
                                  variant="success"
                                  disabled={submitDisable}
                                  onclick={submitFormHandler}
                                  disable-animation>
                </lightning-button>
            </div>
            <template lwc:if={saveDocumentsFail}>
                <div class="slds-media slds-media_center slds-scoped-notification slds-m-bottom_medium submit-error-message" role="status">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="utility:warning"
                                        alternative-text="save documents error"
                                        title="save documents error"
                                        size="small">
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p>There was a problem saving your documents. Please contact salesforce@stthomas.edu to report this error.</p>
                    </div>
                </div>
            </template>
            <template lwc:if={submitBiasIncidentFormFail}>
                <div class="slds-media slds-media_center slds-scoped-notification slds-m-bottom_medium submit-error-message" role="status">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="utility:warning"
                                        alternative-text="submit bias incident form error"
                                        title="submit bias incident form error"
                                        size="small">
                        </lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p>There was a problem submitting your form. Please contact salesforce@stthomas.edu to report this error.</p>
                    </div>
                </div>
            </template>
        </template>
    </div>
</template>
