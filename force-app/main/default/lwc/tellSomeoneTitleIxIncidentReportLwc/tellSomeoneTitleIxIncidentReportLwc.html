<!-- Tell Someone Title Ix Incident Report Lwc -->
<template>
    <div class="slds-is-relative">
        <template lwc:if={showSpinner}>
            <lightning-spinner alternative-text="Submitting" size="medium" variant="brand" class="slds-is-fixed"></lightning-spinner>
        </template>
        <div>
            <p class="slds-m-bottom_medium">Please complete this form with as much detail as possible. If we need
                additional information from you, we will contact you at the email/number you list on the form. All
                reports are confidential.</p>
        </div>
        <template lwc:if={showFormAll}>
            <div>
                <h2 class="slds-m-bottom_xx-small">Form Overview</h2>
                <p class="slds-m-bottom_x-small">By submitting a Title IX Public Report, you are demonstrating care to
                    promote and protect the personal dignity and well-being of the St. Thomas community. Thank you,
                    and we will likewise take care to respect your privacy and offer you support and resources.</p>
                <p class="slds-m-bottom_x-small">We will respond promptly to your concern. The Title IX Coordinator
                    (or her designee) will follow up with you within one business day- if you have chosen to leave
                    your contact information- to make sure that we understand your concern and can discuss any next
                    steps and possible support options for those involved.</p>
                <p class="slds-m-bottom_x-small">Submitting a Title IX Report does not start emergency or crisis
                    response or the sexual misconduct complaint process. If this is an emergency, contact the Police
                    or Public Safety for immediate intervention. However, based on the information you share, the
                    University may take some immediate action to ensure that our community members are safe and
                    supported.</p>
                <p>Thank you for keeping our campus healthy and safe by informing us of this
                    incident. For additional information including resources and university policy and processes, please
                    visit <a href="https://www.stthomas.edu/title-ix" target=_blank>https://www.stthomas.edu/title-ix</a>.</p>
            </div>
            <div>
                <h2 class="slds-m-bottom_xx-small">Reporter Type</h2>
                <p class="slds-m-bottom_x-small">St. Thomas faculty, staff and Resident Assistants <u>MUST IDENTIFY THEMSELVES</u> when submitting a Title IX Report.</p>
                <p class="slds-m-bottom_x-small">For others, we do not require that you share your name and contact
                    information; however, without this information, we will likely be limited in what we can do to
                    follow-up on the reported concern. Please note that to best support you, address the behavior of the
                    person of concern and to protect our community, we typically need follow-up and clarifying
                    information from the reporting person.</p>
                <p>We encourage you to share your name and contact information.</p>
            </div>
                <div lwc:if={isAnonymous}>
                    <h2 class="slds-m-bottom_xx-small">Anonymous Reporting</h2>
                    <p class="slds-m-bottom_xxx-small">All reports are confidential. If you select to report an incident as
                        anonymous, St. Thomas will not be able to contact you. Reporting anonymously limits the university's
                        ability to respond.</p>
                    <div class="slds-form-element slds-m-bottom_medium">
                        <label class="slds-form-element__label selection-labels">
                            <span class="slds-text-nowrap">I understand the statement about Anonymous Reporting<abbr class="slds-required" title="required">*</abbr></span></label>
                        <div class="slds-form-element__control">
                            <template for:each={anonymousReportingOptions} for:item="anonymous">
                                <div class="slds-radio slds-p-bottom_xx-small slds-m-left_xxx-small" key={anonymous.value}>
                                    <input type="radio"
                                           id={anonymous.value}
                                           name="Anonymous Reporting Select"
                                           value={anonymous.value}
                                           data-selecttype="anonymousreporting"
                                           onclick={selectValueHandler}
                                           class="picklist-radio"
                                           required/>
                                    <label class="slds-radio__label" for={anonymous.value}>
                                        <span class="slds-radio_faux"></span>
                                        <span class="picklist-radio-text">{anonymous.label}</span>
                                    </label>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                <div class="slds-grid slds-grid_vertical slds-m-bottom_medium">
                    <h2 class="slds-m-bottom_xx-small">Status of Individual Who Caused Harm</h2>
                    <div class="slds-col slds-size_1-of-1">
                        <div class="slds-m-bottom_x-small">
                            <p class="slds-m-bottom_x-small">By sharing the status of the person who caused harm, this report
                                will be routed appropriately. In nearly all instances, the Title IX Coordinator (or their
                                designee) will follow-up within one business day of receipt of this report.</p>
                            <p class="slds-m-bottom_x-small">If the person who caused harm is a <b>student</b>, the Title IX
                                Coordinator, Director of Public Safety, and Dean of Students will be alerted.</p>
                            <p class="slds-m-bottom_x-small">If this is about an <b>employee</b> and their actions or behavior caused
                                harm, the Title IX Coordinator, Public Safety Director, and the Chief Human Resources
                                Officer will be alerted.</p>
                            <p class="slds-m-bottom_x-small">If you are <b>unsure</b> of the status of the individual or if they are
                                a <b>visitor/guest</b> to the University, the Title IX Coordinator, Dean of Students and Public
                                Safety will be alerted.</p>
                        </div>
                    </div>
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12">
                        <label class="slds-form-element__label selection-labels">
                            <span class="slds-text-nowrap">Status of who caused harm<abbr class="slds-required" title="required">*</abbr></span></label>
                        <div class="slds-form-element__control slds-m-top_xx-small">
                            <lightning-combobox id="titleix-report-status-who-caused-harm-id"
                                                name="Status Who Caused Harm"
                                                label=""
                                                value={statusWhoCausedHarmValue}
                                                placeholder="Select..."
                                                options={statusWhoCausedHarmOptions}
                                                data-selecttype="statuswhocausedharm"
                                                onchange={selectValueHandler}
                                                variant="label-hidden"
                                                required="true">
                            </lightning-combobox>
                        </div>
                    </div>
                </div>
                <template lwc:if={isNotAnonymous}>
                    <fieldset class={reporterElementsCss}>
                        <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12 slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="titleix-reporter-name-id">
                                Reporter's Name</label>
                            <div class="slds-form-element__control">
                                <lightning-input id="titleix-reporter-name-id"
                                                 type="text"
                                                 label=""
                                                 value={titleIxIncidentFormValues.reporterName}
                                                 data-inputtype="name"
                                                 variant="label-hidden"
                                                 max-length=255
                                                 onchange={inputValueHandler}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12 slds-m-bottom_small">
                            <label class="slds-form-element__label selection-labels" for="titleix-reporter-email-id">
                                <span class="slds-text-nowrap">Reporter's Email<abbr class="slds-required" title="required">*</abbr></span></label>
                            <div class="slds-form-element__control">
                                <lightning-input id="titleix-reporter-email-id"
                                                 type="text"
                                                 label=""
                                                 value={titleIxIncidentFormValues.reporterEmail}
                                                 data-inputtype="email"
                                                 variant="label-hidden"
                                                 max-length=255
                                                 required="true"
                                                 onchange={inputValueHandler}
                                                 onblur={emailValidationBlur}>
                                </lightning-input>
                                <div lwc:if={validEmailWarning} class="validation-text">Invalid email address format</div>
                            </div>
                        </div>
                        <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12 slds-m-bottom_medium">
                            <label class="slds-form-element__label selection-labels" for="titleix-reporter-phone-id">
                                Reporter's Phone</label>
                            <div class="slds-form-element__control">
                                <lightning-input id="titleix-reporter-phone-id"
                                                 type="text"
                                                 label=""
                                                 value={titleIxIncidentFormValues.reporterPhone}
                                                 data-inputtype="phone"
                                                 variant="label-hidden"
                                                 max-length=255
                                                 onchange={inputValueHandler}>
                                </lightning-input>
                            </div>
                        </div>
                    </fieldset>
                </template>
                <div class="slds-grid slds-m-bottom_medium">
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_11-of-12">
                        <label class="slds-form-element__label selection-labels" for="titleix-report-incident-description-id">
                            <span class="slds-text-nowrap">Incident / Concerning Behavior Description<abbr class="slds-required" title="required">*</abbr></span></label>
                        <p class="textarea-sublabel">Provide a brief, concise narrative of the incident or behavior(s) of concern.</p>
                        <div class="slds-form-element__control">
                            <lightning-textarea class="custom-textarea-tall"
                                                id="titleix-report-incident-description-id"
                                                label=""
                                                value={titleIxIncidentFormValues.description}
                                                data-inputtype="description"
                                                variant="label-hidden"
                                                max-length=20000
                                                required="true"
                                                onchange={inputValueHandler}>
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
                <div class="slds-grid slds-m-bottom_medium">
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12">
                        <label class="slds-form-element__label selection-labels" for="titleix-report-who-harmed-id">
                            Name of the person who was harmed</label>
                        <div class="slds-form-element__control">
                            <lightning-input id="titleix-report-who-harmed-id"
                                             type="text"
                                             label=""
                                             value={titleIxIncidentFormValues.person_who_was_harmed_complainants}
                                             data-inputtype="whoharmed"
                                             variant="label-hidden"
                                             max-length=255
                                             onchange={inputValueHandler}>
                            </lightning-input>
                        </div>
                    </div>
                </div>
                <div class="slds-grid slds-m-bottom_medium">
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_11-of-12">
                        <label class="slds-form-element__label selection-labels" for="titleix-report-location-id">
                            Location of Incident</label>
                        <p class="textarea-sublabel">Did this occur on-campus, off-campus, in a specific residence hall, out of
                            the country, or unknown? Be as specific as possible.</p>
                        <div class="slds-form-element__control">
                            <lightning-textarea class="custom-textarea"
                                                id="titleix-report-location-id"
                                                label=""
                                                value={titleIxIncidentFormValues.additionalLocation}
                                                data-inputtype="location"
                                                variant="label-hidden"
                                                max-length="255"
                                                onchange={inputValueHandler}>
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
                <div class="slds-grid slds-m-bottom_medium">
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_7-of-12">
                        <label class="slds-form-element__label selection-labels" for="titleix-incident-dates-id">
                            <span class="slds-text-nowrap">Date of Incident(s)<abbr class="slds-required" title="required">*</abbr></span></label>
                        <div class="slds-form-element__control">
                            <lightning-input id="titleix-incident-dates-id"
                                             type="text"
                                             label=""
                                             value={titleIxIncidentFormValues.date_of_incidents}
                                             data-inputtype="dates"
                                             variant="label-hidden"
                                             required="true"
                                             max-length="255"
                                             onchange={inputValueHandler}>
                            </lightning-input>
                        </div>
                    </div>
                </div>
                <div class="slds-form-element slds-grid slds-grid_vertical slds-m-bottom_medium">
                    <label class="slds-form-element__label slds-col slds-size_1-of-1 selection-labels" for="titleix-report-who-caused-harm-id">Name of the person who caused harm:</label>
                    <p class="slds-col slds-size_1-of-1 textarea-sublabel">Adding the name of the person who caused harm is not required in order to share concern for another individual.</p>
                    <div class="slds-form-element__control slds-col slds-size_1-of-1 slds-large-size_7-of-12">
                        <lightning-input id="titleix-report-who-caused-harm-id"
                                         type="text"
                                         label=""
                                         value={titleIxIncidentFormValues.person_who_did_harm_respondents}
                                         data-inputtype="whocausedharm"
                                         variant="label-hidden"
                                         max-length="255"
                                         onchange={inputValueHandler}>
                        </lightning-input>
                    </div>
                </div>
                <div class="slds-grid slds-m-bottom_medium">
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_11-of-12">
                        <label class="slds-form-element__label selection-labels" for="titleix-report-witnesses-id">
                            Witness(es)</label>
                        <p class="textarea-sublabel">Are there other students, staff, faculty, family or visitors who may have witnessed any of the concerns outlined above?</p>
                        <div class="slds-form-element__control">
                            <lightning-textarea class="custom-textarea"
                                                id="titleix-report-witnesses-id"
                                                label=""
                                                value={titleIxIncidentFormValues.otherWitness}
                                                data-inputtype="witnesses"
                                                variant="label-hidden"
                                                max-length="255"
                                                onchange={inputValueHandler}>
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
                <div class="slds-form-element slds-grid_vertical slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1">
                        <label class="slds-form-element__label selection-labels">
                            <span class="slds-text-nowrap">Notification<abbr class="slds-required" title="required">*</abbr></span></label>
                        <p class="slds-m-bottom_xx-small textarea-sublabel">If you are not the impacted/harmed party and reporting on their behalf, do they know you are submitting this report?</p>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_7-of-12">
                        <div class="slds-form-element__control slds-m-top_xx-small">
                            <lightning-combobox id="titleix-report-notification-id"
                                                name="notification"
                                                label=""
                                                value=""
                                                placeholder="Select..."
                                                options={notificationOptions}
                                                data-selecttype="notification"
                                                onchange={selectValueHandler}
                                                variant="label-hidden"
                                                required="true">
                            </lightning-combobox>
                        </div>
                    </div>
                </div>
                <div class="slds-grid slds-m-bottom_medium">
                    <div class="slds-form-element slds-col slds-size_1-of-1 slds-large-size_11-of-12">
                        <label class="slds-form-element__label selection-labels" for="titleix-report-follow-up-id">
                            <span class="slds-text-nowrap">Reporter Follow-up<abbr class="slds-required" title="required">*</abbr></span></label>
                        <p class="textarea-sublabel">Let us know the kind of follow-up you'd like to receive once you have
                            submitted this report (advice, self-care, resources, no follow-up requested, etc.)</p>
                        <div class="slds-form-element__control">
                            <lightning-textarea class="custom-textarea"
                                                id="titleix-report-follow-up-id"
                                                label=""
                                                value={titleIxIncidentFormValues.reporter_followup}
                                                data-inputtype="followup"
                                                variant="label-hidden"
                                                max-length=255
                                                required="true"
                                                onchange={inputValueHandler}>
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
                <div class="slds-m-top_medium">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label selection-labels" for="titleix-report-attach-documents-id">
                            Attach Documents/Upload</label>
                        <p class="textarea-sublabel">Upload any supporting documentation that you have for this incident.<br>
                            A total of {maxFileCount} files at a maximum of {maxFileSize}MB per file can be uploaded.<br>
                            Supported documents types: .csv, .doc, .docx, .jpg, .jpeg, .pdf, .png, .txt, .xls, .xlsx.</p>
                        <div class="slds-form-element__control">
                            <lightning-input
                                    id="titleix-report-attach-documents-id"
                                    type="file"
                                    label=""
                                    accept={acceptedExtensionTypes}
                                    multiple="true"
                                    onchange={attachDocumentsHandler}>
                            </lightning-input>
                        </div>
                    </div>
                    <div lwc:if={showAttachDocumentName} class="slds-m-top_small attached-file-list">
                        <p>Attached Documents:</p>
                        <template for:each={attachDocuments} for:item="file">
                            <div key={file.fileId} class="slds-p-left_xx-small">
                                {file.fileName}
                                <lightning-button-icon class="slds-m-left_x-small"
                                                       icon-name="utility:clear"
                                                       variant="bare"
                                                       alternative-text="Delete File"
                                                       title="Delete File"
                                                       data-fileid={file.fileId}
                                                       onclick={attachDocumentsDelete}>
                                </lightning-button-icon>
                            </div>
                        </template>
                    </div>
                    <div lwc:if={showAttachDocumentExcludeName} class="slds-m-top_xx-small excluded-file-list">
                        <p>Excluded Documents:</p>
                        <template for:each={attachDocumentsExclude} for:item="file">
                            <p key={file.fileId} class="slds-p-left_xx-small">{file.fileName} {file.fileSize}MB - {file.fileWarning}</p>
                        </template>
                    </div>
                </div>
                <div class={submitSectionElementCss}>
                    <div class="slds-m-top_x-large slds-m-bottom_medium">
                        <div class="slds-m-bottom_xxx-small" lwc:if={submitDisable}>
                            <p class="submit-warning">
                                <abbr class="slds-required" title="Required">*</abbr> Required fields not completed.
                            </p>
                        </div>
                        <lightning-button class="submit_button"
                                          title='Please enter all required fields.'
                                          type="button"
                                          label="SUBMIT"
                                          variant="brand"
                                          disabled={submitDisable}
                                          onclick={submitFormHandler}
                                          disable-animation>
                        </lightning-button>
                    </div>
                </div>
        </template>
    </div>
</template>
